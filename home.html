<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wargame">
<title>Global Wargame · 2030–2036</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563EB%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3Cpath d=%27M7 16h18M16 7c4 4 4 14 0 18c-4-4-4-14 0-18z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  /* ------------------------------------------------------------------
     App shell. Every tool runs in its own iframe pane, created on first
     visit and kept alive afterwards, so a game in progress survives a
     trip to the catalogue or the globe.
     ------------------------------------------------------------------ */
  html, body { height: 100%; overflow: hidden; }
  body.shell {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
  }
  .gw-bg { display: none; }

  /* ---------- Desktop top bar ---------- */
  .sh-top {
    display: flex; align-items: center; gap: 18px;
    padding: 0 16px;
    height: 52px;
    padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 5;
  }
  .sh-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text); white-space: nowrap;
    font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 300;
  }
  .sh-brand b { font-weight: 700; color: var(--accent); }
  .sh-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--gradient-accent-2, var(--accent));
    display: grid; place-items: center; color: #fff;
    font: 700 12px var(--font-mono); letter-spacing: 0;
  }
  .sh-nav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .sh-nav::-webkit-scrollbar { display: none; }
  .sh-nav button {
    display: flex; align-items: center; gap: 7px;
    background: none; border: 0; border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
    font: 600 11px var(--font-ui); letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text3); white-space: nowrap;
  }
  .sh-nav button svg { width: 16px; height: 16px; }
  .sh-nav button:hover { color: var(--text); background: var(--hairline, rgba(127,127,127,.08)); }
  .sh-nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft, rgba(37,99,235,.1)); }
  .sh-actions { display: flex; align-items: center; gap: 6px; }
  .sh-icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-width: 34px; padding: 0 10px;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text2); cursor: pointer; text-decoration: none;
    font: 600 10.5px var(--font-ui); letter-spacing: 1px; text-transform: uppercase;
  }
  .sh-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sh-icon-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft, transparent); }
  .sh-icon-btn svg { width: 16px; height: 16px; }
  .sh-icon-btn .icon-sun { display: none; }
  [data-theme="dark"] .sh-icon-btn .icon-sun { display: block; }
  [data-theme="dark"] .sh-icon-btn .icon-moon { display: none; }
  #btn-split { display: none; }
  body[data-route="play"] #btn-split, body[data-route="globe"] #btn-split { display: inline-flex; }

  /* ---------- Panes ---------- */
  .sh-stage { position: relative; min-height: 0; display: grid; }
  .sh-pane { grid-area: 1 / 1; min-height: 0; min-width: 0; display: none; position: relative; }
  .sh-pane.active { display: block; }
  .sh-pane iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .sh-loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--text3); font: 600 11px var(--font-mono); letter-spacing: 2px; text-transform: uppercase;
    pointer-events: none;
  }
  .sh-pane.loaded .sh-loading { display: none; }

  /* Engine and globe side by side on wide screens */
  body.split[data-route="play"] .sh-stage,
  body.split[data-route="globe"] .sh-stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  body.split[data-route="play"] .sh-pane[data-route="play"],
  body.split[data-route="globe"] .sh-pane[data-route="play"] { display: block; grid-area: 1 / 1; }
  body.split[data-route="play"] .sh-pane[data-route="globe"],
  body.split[data-route="globe"] .sh-pane[data-route="globe"] { display: block; grid-area: 1 / 2; border-left: 1px solid var(--border); }

  /* ---------- Mobile tab bar ---------- */
  .sh-tabbar { display: none; }
  .sh-sheet-backdrop { position: fixed; inset: 0; background: rgba(5,10,25,.45); z-index: 20; }
  .sh-sheet-backdrop[hidden] { display: none; }
  .sh-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--panel); border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(0,0,0,.25);
  }
  .sh-sheet[hidden] { display: none; }
  .sh-sheet .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px auto 10px; }
  .sh-sheet button, .sh-sheet a {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: none; border: 0; border-radius: 10px;
    padding: 14px 12px; color: var(--text); text-decoration: none; text-align: left;
    font: 500 15px var(--font-ui); cursor: pointer;
  }
  .sh-sheet button:active, .sh-sheet a:active { background: var(--hairline, rgba(127,127,127,.1)); }
  .sh-sheet svg { width: 22px; height: 22px; color: var(--text2); flex-shrink: 0; }
  .sh-sheet small { display: block; color: var(--text3); font-size: 12px; margin-top: 2px; }
  .sh-sheet hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

  @media (max-width: 820px) {
    .sh-top { display: none; }
    body.shell { grid-template-rows: 1fr auto; }
    .sh-tabbar {
      display: grid; grid-template-columns: repeat(6, 1fr);
      background: color-mix(in srgb, var(--panel) 96%, transparent);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative; z-index: 5;
    }
    .sh-tabbar button {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      height: 56px; background: none; border: 0; cursor: pointer;
      color: var(--text3); font: 600 10px var(--font-ui); letter-spacing: .3px;
      -webkit-tap-highlight-color: transparent;
    }
    .sh-tabbar button svg { width: 22px; height: 22px; }
    .sh-tabbar button[aria-current="page"] { color: var(--accent); }
    .sh-tabbar button[aria-current="page"] svg { stroke-width: 2.1; }
    /* No split view on phones */
    body.split .sh-stage { grid-template-columns: 1fr !important; }
    body.split .sh-pane { display: none !important; }
    body.split .sh-pane.active { display: block !important; grid-area: 1 / 1 !important; border-left: 0 !important; }
  }
  @media (min-width: 821px) {
    .sh-sheet, .sh-sheet-backdrop { display: none !important; }
  }
  @media (max-width: 1100px) {
    .sh-nav button .lbl-long { display: none; }
  }
  @media (min-width: 1101px) {
    .sh-nav button .lbl-short { display: none; }
  }
</style>
</head>

<header class="sh-top">

    <button data-go="play"><svg><use href="#i-play"/></svg><span class="lbl-long">Engine &amp; Play</span><span class="lbl-short">Play</span></button>
    <button data-go="globe"><svg><use href="#i-globe"/></svg><span>Globe</span></button>

      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>

<main class="sh-stage" id="stage"></main>

<nav class="sh-tabbar" aria-label="Sections">
  <button data-go="home"><svg><use href="#i-home"/></svg>Home</button>
  <button data-go="cards"><svg><use href="#i-cards"/></svg>Cards</button>

  <button data-go="globe"><svg><use href="#i-globe"/></svg>Globe</button>
  <button data-go="tactical"><svg><use href="#i-tactical"/></svg>Tactical</button>

<div class="sh-sheet-backdrop" id="sheet-backdrop" hidden></div>

  <div class="grip"></div>
  <button data-go="builder"><svg><use href="#i-builder"/></svg><span>Card Builder<small>Author a new action card</small></span></button>
  <button data-go="diagnostics"><svg><use href="#i-diag"/></svg><span>Diagnostics<small>Check the install and catalogue</small></span></button>
  <hr>
  <button id="sheet-theme"><svg><use href="#i-theme"/></svg><span>Toggle light / dark</span></button>
  <a id="sheet-pop" target="_blank" rel="noopener"><svg><use href="#i-pop"/></svg><span>Open current tool on its own<small>Full page, outside the app</small></span></a>
</div>

<script>
(function () {
  'use strict';

  var ROUTES = {
    home:        { src: 'overview.html',     title: 'Home' },
    cards:       { src: 'index.html',        title: 'Operations Center' },
    play:        { src: 'engine.html',       title: 'Engine & Play' },
    globe:       { src: 'globe.html',        title: 'Globe' },
    tactical:    { src: 'tactical.html',     title: 'Tactical Operations' },
    builder:     { src: 'card-builder.html', title: 'Card Builder' },
    diagnostics: { src: 'diagnostics.html',  title: 'Diagnostics' }
  };
  var SPLIT_KEY = 'gw-shell-split';
  var stage = document.getElementById('stage');
  var panes = {};          // route -> { el, frame, path }
  var current = null;
  var lastGameState = null;
  var globeReady = false;

  function isFile() { return location.protocol === 'file:' || !location.origin || location.origin === 'null'; }
  function postTarget() { return isFile() ? '*' : location.origin; }
  function originOk(e) { return isFile() ? (e.origin === 'null' || e.origin === 'file://') : e.origin === location.origin; }
  function wide() { return window.matchMedia('(min-width: 821px)').matches; }

  function paneFor(route) {
    if (panes[route]) return panes[route];
    var el = document.createElement('section');
    el.className = 'sh-pane';
    el.dataset.route = route;
    el.innerHTML = '<div class="sh-loading">Loading ' + ROUTES[route].title + '…</div>';
    var frame = document.createElement('iframe');
    frame.title = ROUTES[route].title;
    frame.name = 'gw-pane-' + route;
    frame.addEventListener('load', function () {
      el.classList.add('loaded');
      sendTheme(frame);
    });
    el.appendChild(frame);
    stage.appendChild(el);
    panes[route] = { el: el, frame: frame, path: ROUTES[route].src };
    frame.src = ROUTES[route].src;
    return panes[route];
  }

  function parseHash() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (/^cards\/[^/]+\.html?$/i.test(h)) return { route: 'cards', path: h };
    if (ROUTES[h]) return { route: h, path: null };
    return { route: 'home', path: null };
  }

  function show(route, path) {
    if (!ROUTES[route]) route = 'home';
    var p = paneFor(route);
    if (path && p.path !== path) { p.path = path; p.frame.src = path; }
    if (isSplit() && (route === 'play' || route === 'globe')) { paneFor('play'); paneFor('globe'); }
    current = route;
    document.body.dataset.route = route;
    for (var r in panes) panes[r].el.classList.toggle('active', r === route);
    document.querySelectorAll('[data-go]').forEach(function (b) {
      if (b.dataset.go === route) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    document.title = ROUTES[route].title + ' · Global Wargame';
    var pop = (p.path || ROUTES[route].src) + '?standalone=1';
    document.getElementById('btn-pop').href = pop;
    document.getElementById('sheet-pop').href = pop;
    if (route === 'globe') pushToGlobe();
  }

  function go(route, path) {
    var hash = '#' + (path && route === 'cards' && path !== 'index.html' ? path : route);
    closeSheet();
    // Re-selecting the Cards or Builder tab returns it to its start page.
    if (route === current && !path && panes[route] && panes[route].path !== ROUTES[route].src &&
        (route === 'cards' || route === 'builder')) {
      path = ROUTES[route].src;
    }
    if (location.hash !== hash) history.pushState(null, '', hash);
    show(route, path);
  }

  window.addEventListener('popstate', function () { var t = parseHash(); show(t.route, t.path); });
  window.addEventListener('hashchange', function () { var t = parseHash(); show(t.route, t.path); });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) return;
    e.preventDefault();
    go(b.dataset.go);
  });

  // ---------- Split view ----------
  function isSplit() { return document.body.classList.contains('split') && wide(); }
  function setSplit(on) {
    document.body.classList.toggle('split', !!on);
    document.getElementById('btn-split').setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem(SPLIT_KEY, on ? '1' : '0'); } catch (_) {}
    if (on) { paneFor('play'); paneFor('globe'); pushToGlobe(); }
  }
  document.getElementById('btn-split').addEventListener('click', function () {
    setSplit(!document.body.classList.contains('split'));
  });
  try { if (localStorage.getItem(SPLIT_KEY) === '1') document.body.classList.add('split'); } catch (_) {}
  document.getElementById('btn-split').setAttribute('aria-pressed', document.body.classList.contains('split') ? 'true' : 'false');

  // ---------- More sheet ----------
  var sheet = document.getElementById('sheet');
  var backdrop = document.getElementById('sheet-backdrop');
  function openSheet() { sheet.hidden = false; backdrop.hidden = false; }
  function closeSheet() { sheet.hidden = true; backdrop.hidden = true; }
  document.getElementById('btn-more').addEventListener('click', function () { sheet.hidden ? openSheet() : closeSheet(); });
  backdrop.addEventListener('click', closeSheet);
  document.getElementById('sheet-pop').addEventListener('click', closeSheet);
  document.getElementById('sheet-theme').addEventListener('click', function () { window.GWTheme.toggle(); closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  // ---------- Theme sync ----------
  function sendTheme(frame) {
    try { frame.contentWindow.postMessage({ type: 'gw-theme', theme: window.GWTheme.get() }, postTarget()); } catch (_) {}
  }
  document.addEventListener('themechange', function () {
    for (var r in panes) sendTheme(panes[r].frame);
  });

  // ---------- Engine <-> globe relay ----------
  function pushToGlobe() {
    var g = panes.globe;
    if (!g || !lastGameState) return;
    try { g.frame.contentWindow.postMessage({ type: 'wargame-state', payload: lastGameState }, postTarget()); } catch (_) {}
  }
  function routeOfSource(src) {
    for (var r in panes) if (panes[r].frame.contentWindow === src) return r;
    return null;
  }

  window.addEventListener('message', function (e) {
    if (!originOk(e)) return;
    var from = routeOfSource(e.source);
    if (!from) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;

    switch (d.type) {
      case 'gw-nav':
        if (ROUTES[d.route]) go(d.route, d.path || null);
        break;
      case 'gw-loc':
        if (panes[from] && d.path) panes[from].path = d.path;
        if (from === current && from === 'cards') {
          var h = '#' + (d.path && d.path !== 'index.html' ? d.path : 'cards');
          if (location.hash !== h) history.replaceState(null, '', h);
          var pop = (d.path || 'index.html') + '?standalone=1';
          document.getElementById('btn-pop').href = pop;
          document.getElementById('sheet-pop').href = pop;
        }
        break;
      case 'wargame-state-out':
        if (from === 'play') { lastGameState = d.payload; if (globeReady) pushToGlobe(); }
        break;
      case 'wargame-globe-ready':
        if (from === 'globe') { globeReady = true; pushToGlobe(); }
        break;
      case 'wargame-open-globe':
        if (wide()) { setSplit(true); show('play'); }
        else go('globe');
        break;
      case 'wargame-close':
        go('home');
        break;
    }
  });

  window.addEventListener('resize', function () { if (current) show(current); });

  // ---------- Start ----------
  var start = parseHash();
  if (!location.hash) history.replaceState(null, '', '#home');
  show(start.route, start.path);
})();
</script>
</body>
</html>
