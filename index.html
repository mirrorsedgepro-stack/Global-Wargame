<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Wargame Operations Center — DIME Catalogue 2030–2036</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(168,162,158,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,162,158,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
    z-index:0;
  }
  .wrapper {
    position:relative;
    z-index:5;
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--text);
  }
  header h1 strong {
    font-weight: 700;
    color: var(--accent);
  }
  header .subtitle {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text3);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .count {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text3);
    text-transform: uppercase;
  }
  .count strong {
    color: var(--accent);
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }

  /* Filter bar */
  .filters {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 18px 20px;
    margin-bottom: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .filter-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text3);
    text-transform: uppercase;
    font-weight: 700;
    min-width: 70px;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .chip {
    font-size: 10px;
    padding: 5px 11px;
    border: 1px solid var(--border);
    color: var(--text2);
    background: var(--bg2);
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    transition: all 0.15s;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border-color: var(--accent);
    color: var(--accent);
  }
  .chip .chip-count {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    opacity: 0.7;
  }
  /* Phase chips — phase colors */
  .chip-phase-COM.active { background: color-mix(in srgb, var(--p-COM) 20%, transparent); border-color: var(--p-COM); color: var(--p-COM); }
  .chip-phase-CON.active { background: color-mix(in srgb, var(--p-CON) 20%, transparent); border-color: var(--p-CON); color: var(--p-CON); }
  .chip-phase-CRI.active { background: color-mix(in srgb, var(--p-CRI) 20%, transparent); border-color: var(--p-CRI); color: var(--p-CRI); }
  /* Domain chips — domain colors */
  .chip-domain-D.active { background: color-mix(in srgb, var(--d-D) 20%, transparent); border-color: var(--d-D); color: var(--d-D); }
  .chip-domain-I.active { background: color-mix(in srgb, var(--d-I) 20%, transparent); border-color: var(--d-I); color: var(--d-I); }
  .chip-domain-M.active { background: color-mix(in srgb, var(--d-M) 20%, transparent); border-color: var(--d-M); color: var(--d-M); }
  .chip-domain-E.active { background: color-mix(in srgb, var(--d-E) 20%, transparent); border-color: var(--d-E); color: var(--d-E); }

  .clear-btn {
    margin-left: auto;
    font-size: 10px;
    padding: 5px 14px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    transition: all 0.15s;
  }
  .clear-btn:hover { border-color: var(--d-M); color: var(--d-M); }

  /* Cards grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }
  .card-tile {
    background: color-mix(in srgb, var(--tile-accent, var(--accent)) 4%, var(--bg));
    border: 1px solid color-mix(in srgb, var(--tile-accent, var(--accent)) 15%, var(--border));
    padding: 16px 18px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card-tile::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--tile-accent, var(--border));
  }
  .card-tile:hover {
    transform: translateY(-2px);
    border-color: var(--tile-accent, var(--accent));
    background: color-mix(in srgb, var(--tile-accent, var(--accent)) 8%, var(--bg));
    box-shadow: 0 8px 24px color-mix(in srgb, var(--tile-accent, var(--accent)) 10%, transparent);
  }
  /* Per-domain tile accent */
  .card-tile.domain-D { --tile-accent: var(--d-D); }
  .card-tile.domain-I { --tile-accent: var(--d-I); }
  .card-tile.domain-M { --tile-accent: var(--d-M); }
  .card-tile.domain-E { --tile-accent: var(--d-E); }

  .tile-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .tile-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .tile-badge {
    font-size: 8px;
    letter-spacing: 2px;
    font-weight: 700;
    padding: 3px 8px;
    text-transform: uppercase;
    border: 1px solid;
  }
  .tile-badge.phase-COM { background: color-mix(in srgb, var(--p-COM) 14%, transparent); border-color: var(--p-COM); color: var(--p-COM); }
  .tile-badge.phase-CON { background: color-mix(in srgb, var(--p-CON) 14%, transparent); border-color: var(--p-CON); color: var(--p-CON); }
  .tile-badge.phase-CRI { background: color-mix(in srgb, var(--p-CRI) 14%, transparent); border-color: var(--p-CRI); color: var(--p-CRI); }
  .tile-badge.domain-D { background: color-mix(in srgb, var(--d-D) 14%, transparent); border-color: var(--d-D); color: var(--d-D); }
  .tile-badge.domain-I { background: color-mix(in srgb, var(--d-I) 14%, transparent); border-color: var(--d-I); color: var(--d-I); }
  .tile-badge.domain-M { background: color-mix(in srgb, var(--d-M) 14%, transparent); border-color: var(--d-M); color: var(--d-M); }
  .tile-badge.domain-E { background: color-mix(in srgb, var(--d-E) 14%, transparent); border-color: var(--d-E); color: var(--d-E); }

  .tile-id {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--tile-accent, var(--text3));
    font-weight: 700;
  }
  .tile-title {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
    line-height: 1.35;
    color: var(--text);
  }
  .tile-risk {
    font-size: 9px;
    letter-spacing: 2px;
    padding: 3px 8px;
    border: 1px solid;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
  }
  .risk-LOW       { border-color: #16a34a; color: #16a34a; background: color-mix(in srgb, #16a34a 8%, transparent); }
  .risk-MEDIUM    { border-color: #ca8a04; color: #ca8a04; background: color-mix(in srgb, #ca8a04 8%, transparent); }
  .risk-HIGH      { border-color: #d97706; color: #d97706; background: color-mix(in srgb, #d97706 10%, transparent); }
  .risk-EXTREME   { border-color: #dc2626; color: #dc2626; background: color-mix(in srgb, #dc2626 10%, transparent); }
  .risk-CRITICAL  { border-color: #dc2626; color: #dc2626; background: color-mix(in srgb, #dc2626 14%, transparent); }
  .risk-STRATEGIC { border-color: #db2777; color: #db2777; background: color-mix(in srgb, #db2777 10%, transparent); }

  .tile-actors { display: flex; flex-wrap: wrap; gap: 4px; }
  .tile-actor {
    font-size: 9px;
    padding: 2px 7px;
    background: color-mix(in srgb, var(--tile-accent, var(--accent)) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--tile-accent, var(--accent)) 35%, transparent);
    color: var(--tile-accent, var(--accent));
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .tile-actor.highlighted {
    background: color-mix(in srgb, var(--tile-accent, var(--accent)) 30%, transparent);
    border-color: var(--tile-accent, var(--accent));
    color: var(--text);
  }
  .tile-summary {
    font-size: 12px;
    line-height: 1.55;
    color: var(--text2);
  }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    letter-spacing: 1px;
    border: 1px dashed var(--border);
    grid-column: 1 / -1;
  }
  .empty-state strong { color: var(--text2); display: block; margin-bottom: 8px; font-size: 15px; letter-spacing: 2px; }

  footer {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text3);
    text-transform: uppercase;
    text-align: center;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <div>
      <h1>Global Wargame <strong>Operations Center</strong></h1>
      <div class="subtitle">DIME Catalogue · 2030–2036 · Indo-Pacific, Middle East, Africa, Europe, South Asia</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <a class="header-action" href="home.html" style="font-size:10px;letter-spacing:2px;color:var(--text3);text-decoration:none;border:1px solid var(--border);padding:6px 14px;text-transform:uppercase;transition:all 0.15s;">← Home</a>
      <a class="header-action" href="card-builder.html" style="font-size:10px;letter-spacing:2px;color:var(--text3);text-decoration:none;border:1px solid var(--border);padding:6px 14px;text-transform:uppercase;transition:all 0.15s;">+ New Card</a>
      <button class="header-action" id="btn-import" style="font-size:10px;letter-spacing:2px;color:var(--text3);background:none;border:1px solid var(--border);padding:6px 14px;text-transform:uppercase;cursor:pointer;font-family:inherit;font-weight:600;">Import card files</button>
      <input type="file" id="file-import" accept=".html,text/html" multiple style="display:none;">
      <div class="count"><strong id="visible-count">0</strong> / <span id="total-count">0</span> cards</div>
    </div>
  </header>
  <style>
    .header-action:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
  </style>

  <div class="filters">
    <div class="filter-row">
      <span class="filter-label">Search</span>
      <input type="text" class="search-box" id="search" placeholder="Title, ID, summary, actor...">
      <button class="clear-btn" id="clear-all">Clear all</button>
    </div>

    <div class="filter-row">
      <span class="filter-label">Country</span>
      <div id="country-chips" style="display:flex;flex-wrap:wrap;gap:6px;flex:1;"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">Phase</span>
      <div id="phase-chips" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">Domain</span>
      <div id="domain-chips" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label">Risk</span>
      <div id="risk-chips" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Global Wargame · DIME Catalogue 2030–2036</footer>
</div>

<script src="engine-data.js"></script>
<script>
// Catalogue is engine-data.js, regenerated by `python3 pack/build.py`.
const CARDS = (window.__ENGINE_DATA && Array.isArray(window.__ENGINE_DATA.cards))
  ? window.__ENGINE_DATA.cards.slice()
  : [];
if (!CARDS.length) {
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#2a0a10;color:#ff9b9b;padding:10px 16px;font:12px/1.5 -apple-system,system-ui,sans-serif;letter-spacing:1px;border-bottom:1px solid #6b1a1a;';
  banner.innerHTML = '<strong>No card data loaded.</strong> Make sure <code>engine-data.js</code> is in the same folder as this page, then reload.';
  document.body.insertBefore(banner, document.body.firstChild);
}

const PHASE_LABEL = {"COM": "Competition", "CON": "Conflict", "CRI": "Crisis"};
const DOMAIN_LABEL = {"D": "Diplomatic", "I": "Informational", "M": "Military", "E": "Economic"};
const RISK_ORDER = ["LOW", "MEDIUM", "HIGH", "EXTREME", "CRITICAL", "STRATEGIC"];

const state = {
  search: "",
  countries: new Set(),
  phases: new Set(),
  domains: new Set(),
  risks: new Set(),
};

// Build chip groups
function buildChips(containerId, items, cls, stateKey) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  items.forEach(({key, label, count}) => {
    const el = document.createElement('div');
    el.className = `chip ${cls}${key}`;
    el.dataset.key = key;
    el.innerHTML = `${label} <span class="chip-count">${count}</span>`;
    el.addEventListener('click', () => {
      if (state[stateKey].has(key)) state[stateKey].delete(key);
      else state[stateKey].add(key);
      el.classList.toggle('active');
      render();
    });
    container.appendChild(el);
  });
}

// Country chips — sorted by count desc, then alpha
const countryCounts = {};
CARDS.forEach(c => c.actors.forEach(a => countryCounts[a] = (countryCounts[a] || 0) + 1));
const countries = Object.keys(countryCounts).sort((a, b) => {
  if (countryCounts[b] !== countryCounts[a]) return countryCounts[b] - countryCounts[a];
  return a.localeCompare(b);
});
buildChips('country-chips', countries.map(c => ({key: c, label: c, count: countryCounts[c]})), 'chip-country-', 'countries');

// Phase chips
const phaseCounts = {};
CARDS.forEach(c => phaseCounts[c.phase] = (phaseCounts[c.phase] || 0) + 1);
buildChips('phase-chips',
  Object.keys(PHASE_LABEL).map(k => ({key: k, label: PHASE_LABEL[k], count: phaseCounts[k] || 0})),
  'chip-phase-', 'phases');

// Domain chips
const domainCounts = {};
CARDS.forEach(c => domainCounts[c.domain] = (domainCounts[c.domain] || 0) + 1);
buildChips('domain-chips',
  Object.keys(DOMAIN_LABEL).map(k => ({key: k, label: DOMAIN_LABEL[k], count: domainCounts[k] || 0})),
  'chip-domain-', 'domains');

// Risk chips
const riskCounts = {};
CARDS.forEach(c => { if (c.risk) riskCounts[c.risk] = (riskCounts[c.risk] || 0) + 1; });
const risksSorted = Object.keys(riskCounts).sort((a, b) => {
  const ai = RISK_ORDER.indexOf(a); const bi = RISK_ORDER.indexOf(b);
  return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
});
buildChips('risk-chips',
  risksSorted.map(r => ({key: r, label: r, count: riskCounts[r]})),
  'chip-risk-', 'risks');

// Search
document.getElementById('search').addEventListener('input', (e) => {
  state.search = e.target.value.toLowerCase().trim();
  render();
});

// Clear all
document.getElementById('clear-all').addEventListener('click', () => {
  state.search = '';
  state.countries.clear();
  state.phases.clear();
  state.domains.clear();
  state.risks.clear();
  document.getElementById('search').value = '';
  document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
  render();
});

// ----- Import card files -----
function rebuildAllChips() {
  // Recompute counts
  const countryCounts = {};
  CARDS.forEach(c => c.actors.forEach(a => countryCounts[a] = (countryCounts[a] || 0) + 1));
  const countries = Object.keys(countryCounts).sort((a, b) => {
    if (countryCounts[b] !== countryCounts[a]) return countryCounts[b] - countryCounts[a];
    return a.localeCompare(b);
  });
  const phaseCounts = {};
  CARDS.forEach(c => phaseCounts[c.phase] = (phaseCounts[c.phase] || 0) + 1);
  const domainCounts = {};
  CARDS.forEach(c => domainCounts[c.domain] = (domainCounts[c.domain] || 0) + 1);
  const riskCounts = {};
  CARDS.forEach(c => { if (c.risk) riskCounts[c.risk] = (riskCounts[c.risk] || 0) + 1; });
  const risksSorted = Object.keys(riskCounts).sort((a, b) => {
    const ai = RISK_ORDER.indexOf(a); const bi = RISK_ORDER.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  buildChips('country-chips',
    countries.map(c => ({key: c, label: c, count: countryCounts[c]})),
    'chip-country-', 'countries');
  buildChips('phase-chips',
    Object.keys(PHASE_LABEL).map(k => ({key: k, label: PHASE_LABEL[k], count: phaseCounts[k] || 0})),
    'chip-phase-', 'phases');
  buildChips('domain-chips',
    Object.keys(DOMAIN_LABEL).map(k => ({key: k, label: DOMAIN_LABEL[k], count: domainCounts[k] || 0})),
    'chip-domain-', 'domains');
  buildChips('risk-chips',
    risksSorted.map(r => ({key: r, label: r, count: riskCounts[r]})),
    'chip-risk-', 'risks');

  // Restore .active class for any filters that are still selected
  function restore(containerId, set) {
    document.getElementById(containerId).querySelectorAll('.chip').forEach(el => {
      if (set.has(el.dataset.key)) el.classList.add('active');
    });
  }
  restore('country-chips', state.countries);
  restore('phase-chips', state.phases);
  restore('domain-chips', state.domains);
  restore('risk-chips', state.risks);
}

function parseCardFromHTML(htmlText, filename) {
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');

  // ID from filename: e.g., COM-D-01-strategic-partnership-upgrade.html
  let id = null;
  const m = filename.match(/^([A-Z]+-[A-Z]-\d+)/);
  if (m) id = m[1];
  // Fallback: look inside the card for .breadcrumb-id or similar
  if (!id) {
    const bc = doc.querySelector('.card-id, .breadcrumb-id, [data-card-id]');
    if (bc) {
      const mm = (bc.textContent || '').match(/([A-Z]+-[A-Z]-\d+)/);
      if (mm) id = mm[1];
    }
  }
  if (!id) return null;
  const parts = id.split('-');
  const phase = parts[0];
  const domain = parts[1];

  const titleEl = doc.querySelector('.card-title');
  const title = titleEl ? titleEl.textContent.trim() : id;

  const actors = Array.from(doc.querySelectorAll('.actor-pill'))
    .map(el => el.textContent.trim())
    .filter(Boolean);

  // Risk: text inside .risk-value or first word containing LOW/MEDIUM/HIGH/CRITICAL
  let risk = null;
  const riskEl = doc.querySelector('.risk-value, .risk-level, .card-risk');
  if (riskEl) {
    const t = (riskEl.textContent || '').toUpperCase();
    const rm = t.match(/\b(LOW|MEDIUM|HIGH|EXTREME|CRITICAL|STRATEGIC)\b/);
    if (rm) risk = rm[1];
  }

  // Summary: first 200 characters of the Action section (or first prose paragraph)
  let summary = '';
  const sections = Array.from(doc.querySelectorAll('.section, section'));
  let actionSection = sections.find(s => {
    const h = s.querySelector('.section-label, .section-title, h2, h3');
    return h && /^\s*action\s*$/i.test((h.textContent || '').trim());
  });
  if (actionSection) {
    const body = actionSection.querySelector('.section-text, p') || actionSection;
    summary = (body.textContent || '').replace(/\s+/g, ' ').trim();
    // If we fell back to the section itself, strip the leading "Action" label
    summary = summary.replace(/^action\s+/i, '');
  } else {
    const first = doc.querySelector('.section-text, .body p, main p, body p');
    if (first) summary = (first.textContent || '').replace(/\s+/g, ' ').trim();
  }
  // 200 matches pack/build.py so an imported card's summary matches the catalogue.
  if (summary.length > 200) summary = summary.slice(0, 200).trimEnd() + '...';

  return { id, phase, domain, file: filename, title, actors, risk, summary };
}

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-import').click();
});

document.getElementById('file-import').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;

  const existingIds = new Set(CARDS.map(c => c.id));
  const added = [];
  const skipped = [];
  const failed = [];

  for (const f of files) {
    try {
      const text = await f.text();
      const parsed = parseCardFromHTML(text, f.name);
      if (!parsed) { failed.push(f.name); continue; }
      if (existingIds.has(parsed.id)) { skipped.push(parsed.id); continue; }
      CARDS.push(parsed);
      existingIds.add(parsed.id);
      added.push(parsed.id);
    } catch (err) {
      failed.push(f.name);
    }
  }

  document.getElementById('total-count').textContent = CARDS.length;
  rebuildAllChips();
  render();

  // Brief toast-like message
  const parts = [];
  if (added.length) parts.push(`Added ${added.length}: ${added.join(', ')}`);
  if (skipped.length) parts.push(`Skipped duplicates: ${skipped.join(', ')}`);
  if (failed.length) parts.push(`Failed to parse: ${failed.join(', ')}`);
  if (parts.length) {
    const toast = document.createElement('div');
    toast.textContent = parts.join(' · ');
    toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#eee;border:1px solid #333;padding:10px 16px;font-size:11px;letter-spacing:1px;text-transform:uppercase;z-index:9999;max-width:80vw;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
  }

  // Reset input so selecting the same file again still fires change
  e.target.value = '';
});

function matches(card) {
  // Country filter — card must contain ALL selected countries (AND logic for precision)
  // Actually use OR logic: card matches if it has ANY of the selected countries. More useful for "show me everything involving Japan".
  if (state.countries.size > 0) {
    const hasAny = card.actors.some(a => state.countries.has(a));
    if (!hasAny) return false;
  }
  if (state.phases.size > 0 && !state.phases.has(card.phase)) return false;
  if (state.domains.size > 0 && !state.domains.has(card.domain)) return false;
  if (state.risks.size > 0 && !state.risks.has(card.risk)) return false;
  if (state.search) {
    const hay = [card.id, card.title, card.summary, card.actors.join(' ')].join(' ').toLowerCase();
    if (!hay.includes(state.search)) return false;
  }
  return true;
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = CARDS.filter(matches);
  document.getElementById('visible-count').textContent = filtered.length;
  document.getElementById('total-count').textContent = CARDS.length;
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><strong>No cards match</strong>Clear filters to see all ${CARDS.length} cards</div>`;
    return;
  }
  grid.innerHTML = filtered.map(c => {
    const riskHTML = c.risk ? `<div class="tile-risk risk-${c.risk}">${c.risk}</div>` : '';
    const actorsHTML = c.actors.map(a => {
      const hl = state.countries.has(a) ? 'highlighted' : '';
      return `<span class="tile-actor ${hl}">${a}</span>`;
    }).join('');
    return `
      <a class="card-tile domain-${c.domain}" href="${c.file}">
        <div class="tile-top">
          <div class="tile-badges">
            <span class="tile-badge phase-${c.phase}">${PHASE_LABEL[c.phase]}</span>
            <span class="tile-badge domain-${c.domain}">${DOMAIN_LABEL[c.domain]}</span>
          </div>
          ${riskHTML}
        </div>
        <div class="tile-id">${c.id}</div>
        <div class="tile-title">${c.title}</div>
        <div class="tile-actors">${actorsHTML}</div>
        <div class="tile-summary">${c.summary}</div>
      </a>`;
  }).join('');
}

render();
</script>
